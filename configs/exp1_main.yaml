name: exp1_main
description: >
  E1 main result. 18-camera layout, real detector beliefs, every adversary,
  Byzantine count 0-6 placed next to the flood (BFS). All baselines and the
  oracle upper reference. Feeds the main table and the accuracy-vs-f figure.
graph: {type: testbed, k: 4}
rounds: 20
scenario: {epicenter: center, t0: 3, speed: 1.0, growth: 0.8}
detector: {type: belief_bank, bank: detector_base}
faults: {placement: bfs, n_crash: 0}
loss: 0.0
seeds: 50
n_byz: [0, 1, 2, 3, 4, 5, 6]
adversaries: [A0, A1, A2, A3, A4, A5, A8]
methods:
  local:          {rule: local}
  unfiltered:     {rule: unfiltered_mean}
  majority:       {rule: majority}
  coord_median:   {rule: coord_median}
  wmsr_F1:        {rule: wmsr, F: 1}
  wmsr_F2:        {rule: wmsr, F: 2}
  bf_v1:          {rule: bf_v1}
  bf_v2:          {rule: bf_v2}
  bf_v2_mix:      {rule: bf_v2, output: mixture}
  oracle:         {rule: oracle}
  oracle_mix:     {rule: oracle, output: mixture}
