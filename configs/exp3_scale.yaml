name: exp3_scale
description: >
  E3 scale and cost. Random geometric kNN networks of 50-400 cameras at the
  testbed density, k = 4 and 6, Byzantine fraction 0-15 % placed at random.
  Records messages per round and CPU time per decision (timing on).
graph: {type: rgg, n: 50, k: 4}
rounds: 20
scenario: {epicenter: center, t0: 3, speed: 1.0, growth: 0.8}
detector: {type: belief_bank, bank: detector_base}
faults: {placement: random, n_crash: 0}
timing: true
seeds: 20
sweep:
  - {key: graph.n, values: [50, 100, 200, 400]}
  - {key: graph.k, values: [4, 6]}
n_byz: [0.0, 0.05, 0.10, 0.15]
adversaries: [A1, A2, A5]
methods:
  local:          {rule: local}
  wmsr_F2:        {rule: wmsr, F: 2}
  bf_v1:          {rule: bf_v1}
  bf_v2:          {rule: bf_v2}
  oracle:         {rule: oracle}
  bf_v2_auto:     {rule: bf_v2, trim: auto}
